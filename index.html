<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calculadora de Confetes 🎉</title><link rel="stylesheet" href="style.css"></head><body><main class="app"><section class="calculator"><h1>Calculadora de Confetes 🎉</h1><div class="display"><div id="history"></div><output id="display">0</output></div><div class="keys"><button data-action="clear">AC</button><button data-action="backspace">⌫</button><button data-action="operator" data-value="÷">÷</button><button data-action="operator" data-value="×">×</button><button data-value="7">7</button><button data-value="8">8</button><button data-value="9">9</button><button data-action="operator" data-value="-">−</button><button data-value="4">4</button><button data-value="5">5</button><button data-value="6">6</button><button data-action="operator" data-value="+">+</button><button data-value="1">1</button><button data-value="2">2</button><button data-value="3">3</button><button class="equals" data-action="equals">=</button><button class="zero" data-value="0">0</button><button data-action="decimal">.</button></div><p>Clique, calcule e comemore 🎊</p></section></main><div id="confetti-container"></div><script src="script.js"></script></body></html>
